name: Publish to PyPI

# Publishes the distribution named `rangers` (import `ranger`) whenever a
# version tag (v*) is pushed. Requires the PYPI_TOKEN secret — an API token
# scoped to the rangers project on pypi.org.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e .[dev]
      - name: Run unit tests
        run: python -m pytest -q

  publish:
    name: Build and upload rangers to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # token-based upload; workflow contents must not be writable at runtime
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate PyPI metadata and README rendering
        run: python -m twine check --strict dist/*
      - name: Smoke-test the built wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/rangers-wheel
          /tmp/rangers-wheel/bin/python -m pip install dist/*.whl
          /tmp/rangers-wheel/bin/python -c "import ranger; assert ranger.__version__ == '${{ github.ref_name }}'.lstrip('v')"
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload --skip-existing dist/*
