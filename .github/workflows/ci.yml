name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e .[dev]
      - name: Run unit tests
        run: python -m pytest -q

  package:
    name: Build and validate PyPI distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate PyPI metadata and README rendering
        run: python -m twine check --strict dist/*
      - name: Smoke-test the built wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/rangers-wheel
          /tmp/rangers-wheel/bin/python -m pip install dist/*.whl
          /tmp/rangers-wheel/bin/python -c 'import ranger; assert ranger.__version__ == "0.6.1"'
