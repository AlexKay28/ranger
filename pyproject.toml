[project]
name = "ranger"
version = "0.2.1"
description = "Agent-as-a-library: run the opencode harness headlessly from Python code"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ranger"]
